[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lscore"
dynamic = ["version"]
description = "A one-command health check for your Linux machine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "lscore contributors" }]
keywords = ["linux", "health", "diagnostics", "cli", "system", "score"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.scripts]
lscore = "lscore:cli_main"

[tool.setuptools]
py-modules = ["lscore"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/lscore.1"]

[tool.setuptools.dynamic]
version = { attr = "lscore.__version__" }
