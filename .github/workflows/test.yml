name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the test suite
        run: python -m unittest -v

  distro:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:stable-slim
          - fedora:latest
          - archlinux:latest
          - alpine:latest
          - opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests in each distribution
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}" sh -c '
            set -e
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache python3 bash grep
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y python3 bash grep
            elif command -v pacman >/dev/null 2>&1; then
              pacman -Syu --noconfirm python bash grep
            elif command -v zypper >/dev/null 2>&1; then
              zypper --non-interactive install python3 bash grep
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y --no-install-recommends python3 bash grep
            fi
            sh -n install.sh && sh -n uninstall.sh
            tmp="$(mktemp -d)"
            sh ./install.sh --prefix "$tmp/bin"
            "$tmp/bin/lscore" --version
            "$tmp/bin/lscore" --list-checks --json > /dev/null
            sh ./uninstall.sh --prefix "$tmp/bin"
            rm -rf "$tmp"
          '

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POSIX sh and bash syntax
        run: |
          sh -n install.sh && sh -n uninstall.sh
          bash -n install.sh && bash -n uninstall.sh
      - name: shellcheck
        run: shellcheck -S warning install.sh uninstall.sh
      - name: Generated bash completion parses
        run: python3 lscore.py --completion bash > /tmp/lscore.bash && bash -n /tmp/lscore.bash
      - name: Man page renders without warnings
        run: |
          if ! command -v groff >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y groff
          fi
          groff -man -Tutf8 -ww man/lscore.1 > /tmp/lscore.man
          grep -q 'lscore' /tmp/lscore.man

  packaging:
    name: Packaging (pip + Nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and install it
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist
          python -m pip install dist/*.whl
          lscore --version
          lscore --list-checks --json | python -c 'import json, sys; assert len(json.load(sys.stdin)) >= 20'
          python -m pip show -f lscore | grep -q 'share/man/man1/lscore.1'
      - uses: cachix/install-nix-action@v30
      - name: Build with Nix
        run: |
          nix build .# -L
          ./result/bin/lscore --version
          test -f ./result/share/man/man1/lscore.1.gz

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No network modules
        run: |
          if grep -nE '^[[:space:]]*(import|from)[[:space:]]+(socket|urllib|http|ftplib|smtplib|requests|telnetlib|xmlrpc)' lscore.py; then
            echo "lscore must stay offline: no network modules allowed"
            exit 1
          fi
      - name: No shell execution
        run: |
          if grep -nE 'shell[[:space:]]*=[[:space:]]*True|os\.system\(|os\.popen\(' lscore.py; then
            echo "lscore runs fixed argument lists only: no shell"
            exit 1
          fi
      - name: LICENSE and the unique install marker
        run: |
          test -f LICENSE
          grep -q 'lscore-install-marker' lscore.py
          grep -q 'lscore-install-marker' install.sh
          grep -q 'lscore-install-marker' uninstall.sh
          grep -q 'lscore-install-marker' man/lscore.1
      - name: Version agrees everywhere
        run: |
          version="$(grep -oE '__version__ = "[0-9.]+"' lscore.py | cut -d'"' -f2)"
          grep -q "lscore $version" man/lscore.1
          grep -q "version = \"$version\"" flake.nix
          grep -q "^pkgver=$version$" packaging/aur/PKGBUILD
          grep -q 'version = { attr = "lscore.__version__" }' pyproject.toml
